let currentSeed = Date.now();
let difficulty = 'medium'; // 'easy', 'medium', 'hard'

function getDifficultySettings() {
  const settings = {
    easy: { range: 20, hidePercent: 0.3, length: 8 },
    medium: { range: 50, hidePercent: 0.4, length: 10 },
    hard: { range: 100, hidePercent: 0.6, length: 12 }
  };
  return settings[difficulty];
}

function generateWorksheet(seed = currentSeed) {
  const rand = seededRandom(seed);
  const { range, hidePercent, length } = getDifficultySettings();
  
  // ... rest of your generation logic, replacing Math.random() with rand()
  // Example for horizontal rows:
  for (let r = 0; r < 3; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    let startNum = Math.floor(rand() * (90 - range + 1)) + 1;
    
    for (let i = 0; i < length; i++) {
      const currentNum = startNum + i;
      const isHidden = (i !== 0) && (rand() < hidePercent);
      rowDiv.appendChild(createBox(currentNum, isHidden));
    }
    document.getElementById('horizontal-container').appendChild(rowDiv);
  }
  // ... similar for vertical chains
}
