  function seededRandom(seed) { return function() { let t = (seed += 0x6D2B79F5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function stringToSeed(str) { let h=0; for(let i=0;i<str.length;i++) h = (Math.imul(31,h)+str.charCodeAt(i))|0; return Math.abs(h)||Date.now(); }
  function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
  function mascotCheer() { const a=['🚀','🦁','🐠','🍭','🎈']; document.querySelector('.mascot').textContent=a[Math.floor(Math.random()*a.length)]; showToast('You got this!'); }
  function getSettings() { let min=+document.getElementById('min-num').value||1, max=+document.getElementById('max-num').value||20; if(min>max)[min,max]=[max,min]; const d=document.getElementById('difficulty').value; const r={easy:0.3,medium:0.45,hard:0.65}; return {min,max,hideRate:r[d],length:d==='easy'?7:d==='medium'?9:11}; }
  let currentAnswers=[], worksheetCompleted=false;
  function createBox(v,isHidden,ans,idx,opts={}){ const b=document.createElement('div'); b.className=`box ${isHidden?'':'static-box'}`; if(isHidden){ if(opts.type==='compare'){ const s=document.createElement('select'); s.className='compare-select'; s.innerHTML='<option>?</option><option>&lt;</option><option>&gt;</option><option>=</option>'; s.dataset.answer=v; s.onchange=function(){ if(this.value===this.dataset.answer)this.style.background='#d4edda'; else this.style.background='#ffe6f2'; checkComplete();}; b.appendChild(s); } else if(opts.type==='words'){ const i=document.createElement('input'); i.type='text'; i.dataset.answer=v.toString().toLowerCase(); i.placeholder='?'; i.oninput=function(){ if(this.value.trim().toLowerCase()===this.dataset.answer)this.classList.add('correct'); else this.classList.remove('correct'); checkComplete();}; b.appendChild(i); } else if(opts.type==='time'){ const i=document.createElement('input'); i.type='text'; i.dataset.answer=v.toLowerCase(); i.placeholder='?'; i.oninput=function(){ if(this.value.trim().toLowerCase()===this.dataset.answer)this.classList.add('correct'); checkComplete();}; b.appendChild(i); } else { const i=document.createElement('input'); i.type='number'; i.inputMode='numeric'; i.dataset.answer=v; i.oninput=function(){ let val=parseInt(this.value); if(!isNaN(val)){ if(val===v){ this.classList.add('correct'); this.classList.remove('incorrect'); } else { this.classList.remove('correct'); this.classList.add('incorrect'); } checkComplete(); } else { this.classList.remove('correct','incorrect'); } }; i.onkeydown=e=>{if(e.key==='e'||e.key==='E'||e.key==='.')e.preventDefault();}; b.appendChild(i); } if(ans&&idx>=0) ans[idx]=v; } else { b.textContent=opts.display||v; } return b; }
  // other generators (genSequence, genSkip, genBonds, genCompare, genPlace, genPattern, genCoins, genWords, genTime, genMixed) remain same as your original
  // But here I'll show only the new genArithmetic and assume the rest are unchanged
  function genArithmetic(rand, s, ans) {
    const container = document.createElement('div');
    const ops = ['+', '-'];
    for (let i = 0; i < 6; i++) {
      const row = document.createElement('div'); row.className = 'arith-row';
      const op = ops[Math.floor(rand() * ops.length)];
      let a, b, res;
      if (op === '+') {
        a = Math.floor(rand() * (s.max - s.min + 1)) + s.min;
        b = Math.floor(rand() * (s.max - a + 1)) + s.min;
        res = a + b;
      } else {
        a = Math.floor(rand() * (s.max - s.min + 1)) + s.min;
        res = Math.floor(rand() * (a - s.min + 1)) + s.min;
        b = a - res;
      }
      const hidePos = Math.floor(rand() * 3);
      const hideThis = rand() < s.hideRate;
      const vals = [a, b, res];
      row.appendChild(createBox(vals[0], hideThis && hidePos === 0, ans, ans.length));
      const opSpan = document.createElement('span'); opSpan.className = 'operator'; opSpan.textContent = op; row.appendChild(opSpan);
      row.appendChild(createBox(vals[1], hideThis && hidePos === 1, ans, ans.length));
      const eqSpan = document.createElement('span'); eqSpan.className = 'equals'; eqSpan.textContent = '='; row.appendChild(eqSpan);
      row.appendChild(createBox(vals[2], hideThis && hidePos === 2, ans, ans.length));
      container.appendChild(row);
    }
    return container;
  }
