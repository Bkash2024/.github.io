<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎈 Practice Playground – A4 Full Page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6c5ce7; --primary-light: #a29bfe; --secondary: #00cec9;
    --accent: #fdcb6e; --bg: #f7f9fc; --card: #ffffff; --text: #2d3436;
    --muted: #636e72; --success: #00b894; --border: #dfe6e9;
    --shadow: 0 3px 10px rgba(0,0,0,0.08); --radius: 12px;
    --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body.theme-jungle { --primary: #27ae60; --primary-light: #58d68d; --secondary: #f39c12; --accent: #ff9ff3; --bg: #f0fff4; }
  body.theme-ocean { --primary: #0984e3; --primary-light: #74b9ff; --secondary: #00cec9; --accent: #ffeaa7; --bg: #f0f8ff; }
  body.theme-candy { --primary: #e84393; --primary-light: #fd79a8; --secondary: #fdcb6e; --accent: #a29bfe; --bg: #fff0f5; }

  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    padding: 16px; transition: background 0.2s; line-height: 1.4;
  }
  body.compact { font-size: 0.9rem; }
  body.compact .worksheet-card { padding: 12px; }
  body.compact .box { width: 44px; height: 44px; font-size: 1rem; }

  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .mascot { font-size: 1.8rem; cursor: pointer; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .settings-toggle { background: var(--card); border: none; font-size: 1.5rem; cursor: pointer; padding: 8px 12px; border-radius: 30px; box-shadow: var(--shadow); color: var(--primary); }

  .controls-panel {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    margin-bottom: 16px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; transition: all 0.2s;
  }
  .controls-panel.collapsed { display: none; }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { font-size: 0.7rem; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
  select, input[type="number"] { padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px; background: #fff; font-size: 0.9rem; }
  input[type="number"] { width: 80px; text-align: center; }
  .btn {
    background: var(--primary); color: white; border: none; padding: 8px 14px;
    border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--primary-light); transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .toggle-group { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; }
  .toggle-btn { padding: 5px 10px; border: none; background: transparent; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .toggle-btn.active { background: var(--primary); color: white; }

  .progress-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; font-size: 0.85rem; color: var(--muted); }
  .stamps { display: flex; gap: 6px; }
  .stamp { width: 32px; height: 32px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; border: 2px solid var(--primary); opacity: 0.4; font-size: 0.8rem; }
  .stamp.earned { background: var(--accent); opacity: 1; }

  .worksheet-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; margin-bottom: 16px; }
  .card-title { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .instructions { color: var(--muted); text-align: center; margin-bottom: 20px; font-size: 0.9rem; }

  .row, .arith-row, .bond-container, .compare-row, .pattern-row {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin: 12px 0; flex-wrap: wrap;
  }
  .box {
    width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border); background: #fff; border-radius: 12px;
    font-weight: 600; font-size: 1.2rem;
  }
  .static-box { background: var(--primary-light); border-color: var(--primary); color: white; }
  .box input {
    width: 100%; height: 100%; border: none; text-align: center; font-size: 1.1rem;
    background: #fff9e6; border-radius: 10px; outline: none; font-weight: 600;
  }
  .box input.correct { background: #d4edda; border: 2px solid var(--success); animation: pop 0.2s; }
  .box input.incorrect { animation: shake 0.2s; border-color: #e84393; background: #ffe6f2; }
  @keyframes pop { 50% { transform: scale(1.05); } }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

  .operator, .equals { font-size: 1.4rem; font-weight: bold; color: var(--primary); min-width: 30px; text-align: center; }
  .bond-target { background: var(--primary-light); padding: 6px 16px; border-radius: 30px; font-weight: bold; }
  .compare-select { width: 52px; height: 52px; font-size: 1.3rem; text-align: center; border-radius: 12px; }
  .pattern-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .pattern-a { background: #74b9ff; } .pattern-b { background: #55efc4; } .pattern-c { background: #ffeaa7; }

  .answer-key { display: none; margin-top: 20px; padding: 12px; background: #fff8e1; border-left: 5px solid var(--accent); border-radius: 0 12px 12px 0; }
  .answer-key.visible { display: block; }
  .answer-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #ffe08a; }

  /* 🖨️ A4 DENSE PRINT LAYOUT - Multi-column to fill page */
  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    body { 
      background: white; 
      padding: 0; 
      margin: 0;
      -webkit-print-color-adjust: exact; 
      print-color-adjust: exact;
    }
    .controls-panel, .settings-toggle, .progress-bar, .btn, .answer-key, .toggle-group, .toast, .celebration { 
      display: none !important; 
    }
    .worksheet-card { 
      box-shadow: none; 
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      background: white !important;
    }
    .worksheet-card.print-dense {
      column-count: 2;
      column-gap: 15mm;
      column-fill: balance;
      height: 270mm;
    }
    .worksheet-card.print-dense .card-header {
      column-span: all;
      border-bottom: 2px solid #333;
      margin-bottom: 8px;
      padding-bottom: 6px;
    }
    .worksheet-card.print-dense .card-title { 
      font-size: 1.2rem;
      font-weight: bold;
    }
    .worksheet-card.print-dense .instructions { 
      column-span: all;
      margin-bottom: 6px; 
      font-size: 0.8rem;
      font-style: italic;
    }
    .worksheet-card.print-dense .row,
    .worksheet-card.print-dense .arith-row,
    .worksheet-card.print-dense .compare-row,
    .worksheet-card.print-dense .bond-container,
    .worksheet-card.print-dense .pattern-row {
      gap: 4px !important; 
      margin: 3px 0 !important;
      break-inside: avoid;
    }
    .worksheet-card.print-dense .box {
      width: 32px !important; 
      height: 32px !important; 
      font-size: 0.85rem !important;
      border-radius: 4px !important; 
      border-width: 1px !important;
      margin: 1px !important;
    }
    .worksheet-card.print-dense .operator,
    .worksheet-card.print-dense .equals { 
      font-size: 0.9rem !important; 
      min-width: 18px !important;
      margin: 0 2px !important;
    }
    .worksheet-card.print-dense .pattern-item { 
      width: 30px !important; 
      height: 30px !important; 
      font-size: 0.85rem !important; 
      border-radius: 6px !important;
      margin: 1px !important;
    }
    .worksheet-card.print-dense .compare-select { 
      width: 32px !important; 
      height: 32px !important; 
      font-size: 0.9rem !important;
    }
    .worksheet-card.print-dense .box input { 
      font-size: 0.8rem !important; 
      background: transparent !important;
    }
    .worksheet-card.print-dense .static-box { 
      background: #e8e8e8 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .worksheet-card.print-dense .bond-target {
      padding: 3px 8px;
      font-size: 0.85rem;
    }
  }

  @media (max-width: 600px) {
    body { padding: 8px; }
    .box { width: 46px; height: 46px; font-size: 1rem; }
    .controls-panel { grid-template-columns: 1fr; }
  }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2d3436; color: white; padding: 6px 16px; border-radius: 40px; z-index: 1000; transition: 0.2s; font-size: 0.85rem; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .celebration { position: fixed; inset: 0; pointer-events: none; z-index: 1000; display: none; }
  .confetti { position: absolute; width: 8px; height: 8px; background: gold; animation: fall 2s linear forwards; }
  @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  
  /* Preview modal */
  .preview-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 2000; padding: 16px;
  }
  .preview-modal.active { display: flex; }
  .preview-content {
    background: white; border-radius: 10px; width: 100%; max-width: 850px;
    max-height: 90vh; overflow: auto; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .preview-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--border);
  }
  .preview-close {
    background: var(--primary); color: white; border: none;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .preview-actions { display: flex; gap: 8px; }
  .preview-btn {
    background: var(--secondary); color: white; border: none;
    padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .preview-note {
    font-size: 0.75rem; color: var(--muted); margin-top: 6px; text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mascot" onclick="mascotCheer()">🚀</span><span>Practice Playground</span></div>
  <button class="settings-toggle" id="settingsToggle" aria-label="Settings">⚙️</button>
</header>

<div class="controls-panel" id="controlsPanel">
  <div class="control-group"><label>📚 Topic</label><select id="topicSelect"></select></div>
  <div class="control-group"><label>🔢 Range</label><div class="control-row"><input type="number" id="minVal" value="1" min="0"><span>–</span><input type="number" id="maxVal" value="20" min="1"></div></div>
  <div class="control-group"><label>🎯 Difficulty</label><select id="difficultySelect"><option value="easy">Easy (30%)</option><option value="medium" selected>Medium (45%)</option><option value="hard">Hard (65%)</option></select></div>
  <div class="control-group"><label>🔢 Skip count</label><select id="skipSelect"><option value="2">2</option><option value="3">3</option><option value="5">5</option><option value="10">10</option><option value="custom">Custom</option></select><input type="number" id="customSkip" placeholder="e.g., 4" style="display:none; margin-top:4px;"></div>
  <div class="control-group"><label>🎨 Theme</label><select id="themeSelect"><option value="space">Space</option><option value="jungle">Jungle</option><option value="ocean">Ocean</option><option value="candy">Candy</option></select></div>
  <div class="control-group"><label>🔑 Seed</label><input type="text" id="seedInput" placeholder="Auto" maxlength="12"></div>
  <div class="control-group"><label>⚡ Actions</label><div class="control-row"><button class="btn" id="generateBtn">✨ Generate</button><button class="btn btn-outline" id="answersBtn">🔑 Answers</button></div></div>
  <div class="control-group"><label>🖨️ View</label><div class="toggle-group"><button class="toggle-btn" id="compactBtn">📱 Compact</button><button class="toggle-btn" id="previewBtn">👁️ Preview</button><button class="toggle-btn" id="printBtn">🖨️ Print</button></div></div>
</div>

<div class="progress-bar">
  <strong>🏆 Stamps:</strong>
  <div class="stamps" id="stampsContainer"></div>
  <span id="progressCount">0/5</span>
  <button class="btn-outline" id="resetStampsBtn" style="padding:4px 10px;">Reset stamps</button>
</div>

<div id="worksheetArea"></div>
<div class="answer-key" id="answerKey"><strong>🔑 Answer Key</strong><div id="answerContent"></div></div>
<div class="celebration" id="celebration"></div>
<div class="toast" id="toastMsg">Ready! 🎈</div>

<!-- Print Preview Modal -->
<div class="preview-modal" id="previewModal">
  <div class="preview-content">
    <div class="preview-header">
      <strong>🖨️ A4 Print Preview (2 columns)</strong>
      <div class="preview-actions">
        <button class="preview-btn" id="previewPrintBtn">🖨️ Print This</button>
        <button class="preview-close" id="previewCloseBtn">✕ Close</button>
      </div>
    </div>
    <div id="previewContent"></div>
    <div class="preview-note">💡 Double-column A4 layout • Minimal margins • Maximum exercises</div>
  </div>
</div>

<script>
(function(){
  const topicSelect = document.getElementById('topicSelect');
  const minInput = document.getElementById('minVal');
  const maxInput = document.getElementById('maxVal');
  const diffSelect = document.getElementById('difficultySelect');
  const skipSelect = document.getElementById('skipSelect');
  const customSkipInput = document.getElementById('customSkip');
  const themeSelect = document.getElementById('themeSelect');
  const seedInput = document.getElementById('seedInput');
  const generateBtn = document.getElementById('generateBtn');
  const answersBtn = document.getElementById('answersBtn');
  const compactBtn = document.getElementById('compactBtn');
  const previewBtn = document.getElementById('previewBtn');
  const printBtn = document.getElementById('printBtn');
  const resetStampsBtn = document.getElementById('resetStampsBtn');
  const settingsToggle = document.getElementById('settingsToggle');
  const controlsPanel = document.getElementById('controlsPanel');
  const worksheetArea = document.getElementById('worksheetArea');
  const answerContentDiv = document.getElementById('answerContent');
  const answerKeyDiv = document.getElementById('answerKey');
  const stampsContainer = document.getElementById('stampsContainer');
  const progressSpan = document.getElementById('progressCount');
  const toastDiv = document.getElementById('toastMsg');
  const previewModal = document.getElementById('previewModal');
  const previewContent = document.getElementById('previewContent');
  const previewCloseBtn = document.getElementById('previewCloseBtn');
  const previewPrintBtn = document.getElementById('previewPrintBtn');

  let currentAnswers = [];
  let worksheetCompleted = false;
  let currentSeed = Date.now();
  let currentTopicId = 'arithmetic';
  let rng = seededRandom(currentSeed);
  let printMultiplier = 1;

  function seededRandom(seed) {
    return function() {
      let t = (seed += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function stringToSeed(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (Math.imul(31, hash) + str.charCodeAt(i)) | 0;
    return Math.abs(hash) || Date.now();
  }
  function showToast(msg) {
    toastDiv.textContent = msg;
    toastDiv.classList.add('show');
    setTimeout(() => toastDiv.classList.remove('show'), 2000);
  }
  function mascotCheer() {
    const mascots = ['🚀', '', '🐠', '🍭', '🎈', '⭐'];
    document.querySelector('.mascot').textContent = mascots[Math.floor(Math.random() * mascots.length)];
    showToast('You got this! 💪');
  }

  function getSettings() {
    let min = parseInt(minInput.value) || 1;
    let max = parseInt(maxInput.value) || 20;
    if (min > max) { [min, max] = [max, min]; minInput.value = min; maxInput.value = max; showToast('Range adjusted'); }
    const diff = diffSelect.value;
    const rates = { easy: 0.3, medium: 0.45, hard: 0.65 };
    let multiplier = printMultiplier;
    if (multiplier > 1 && (currentTopicId === 'compare' || currentTopicId === 'words')) multiplier = 8;
    let skipVal = parseInt(skipSelect.value);
    if (skipSelect.value === 'custom') {
      skipVal = parseInt(customSkipInput.value) || 2;
      if (skipVal < 1) skipVal = 2;
    }
    return { min, max, hideRate: rates[diff], multiplier, skipVal };
  }

  function isPrintMode() { return printMultiplier > 1; }

  function createBox(value, isHidden, answerArray, idx, options = {}) {
    const box = document.createElement('div');
    box.className = `box ${isHidden ? '' : 'static-box'}`;
    if (isHidden) {
      if (options.type === 'compare' && isPrintMode()) {
        const blank = document.createElement('span');
        blank.textContent = '___';
        blank.style.fontSize = '0.9rem';
        blank.style.fontWeight = 'bold';
        blank.style.minWidth = '28px';
        blank.style.textAlign = 'center';
        box.appendChild(blank);
        if (answerArray && idx >= 0) answerArray[idx] = value;
      } else if (options.type === 'compare') {
        const sel = document.createElement('select');
        sel.className = 'compare-select';
        sel.innerHTML = '<option>?</option><option>&lt;</option><option>&gt;</option><option>=</option>';
        sel.dataset.answer = value;
        sel.addEventListener('change', () => {
          if (sel.value === sel.dataset.answer) sel.style.background = '#d4edda';
          else sel.style.background = '#ffe6f2';
          checkComplete();
        });
        box.appendChild(sel);
        if (answerArray && idx >= 0) answerArray[idx] = value;
      } else if (options.type === 'words') {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.dataset.answer = value.toString().toLowerCase();
        inp.placeholder = '___';
        if (isPrintMode()) inp.style.width = '70px';
        inp.addEventListener('input', () => {
          if (inp.value.trim().toLowerCase() === inp.dataset.answer) inp.classList.add('correct');
          else inp.classList.remove('correct');
          checkComplete();
        });
        box.appendChild(inp);
        if (answerArray && idx >= 0) answerArray[idx] = value;
      } else if (options.type === 'time') {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.dataset.answer = value.toLowerCase();
        inp.placeholder = '?';
        inp.addEventListener('input', () => {
          if (inp.value.trim().toLowerCase() === inp.dataset.answer) inp.classList.add('correct');
          checkComplete();
        });
        box.appendChild(inp);
        if (answerArray && idx >= 0) answerArray[idx] = value;
      } else {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.inputMode = 'numeric';
        inp.dataset.answer = value;
        inp.addEventListener('input', () => {
          const v = parseInt(inp.value);
          if (!isNaN(v)) {
            if (v === value) { inp.classList.add('correct'); inp.classList.remove('incorrect'); }
            else { inp.classList.remove('correct'); inp.classList.add('incorrect'); }
            checkComplete();
          } else { inp.classList.remove('correct', 'incorrect'); }
        });
        inp.addEventListener('keydown', e => { if (e.key === 'e' || e.key === 'E' || e.key === '.') e.preventDefault(); });
        box.appendChild(inp);
        if (answerArray && idx >= 0) answerArray[idx] = value;
      }
    } else {
      box.textContent = options.display || value;
    }
    return box;
  }

  const exercises = {};

  exercises.sequence = {
    title: '🔢 Number Sequences',
    instructions: 'Fill in the missing numbers.',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const length = 7;
      const rows = 6 * settings.multiplier;
      const usedStarts = new Set();
      for (let r = 0; r < rows; r++) {
        let start;
        do { start = Math.floor(rand() * (settings.max - settings.min - length + 1)) + settings.min; } while (usedStarts.has(start));
        usedStarts.add(start);
        const rowDiv = document.createElement('div'); rowDiv.className = 'row';
        for (let i = 0; i < length; i++) {
          const num = start + i;
          const hide = (i > 0) && (rand() < settings.hideRate);
          rowDiv.appendChild(createBox(num, hide, answerArray, answerArray.length));
        }
        container.appendChild(rowDiv);
      }
      return container;
    }
  };

  exercises.skip = {
    title: '🔁 Skip Counting',
    instructions: `Count by ${skipSelect.value === 'custom' ? (customSkipInput.value || 2) : skipSelect.value}.`,
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const skip = settings.skipVal;
      const length = 7;
      const rows = 6 * settings.multiplier;
      const usedStarts = new Set();
      for (let r = 0; r < rows; r++) {
        let start;
        do { start = Math.floor(rand() * (settings.max - skip * length + 1)) + settings.min; } while (usedStarts.has(start));
        usedStarts.add(start);
        const rowDiv = document.createElement('div'); rowDiv.className = 'row';
        for (let i = 0; i < length; i++) {
          const num = start + i * skip;
          const hide = (i > 0) && (rand() < settings.hideRate);
          rowDiv.appendChild(createBox(num, hide, answerArray, answerArray.length));
        }
        container.appendChild(rowDiv);
      }
      return container;
    }
  };

  exercises.arithmetic = {
    title: '➕➖ Arithmetic',
    instructions: 'Solve the missing number.',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const ops = ['+', '-'];
      const problemCount = 12 * settings.multiplier;
      for (let i = 0; i < problemCount; i++) {
        const row = document.createElement('div'); row.className = 'arith-row';
        const op = ops[Math.floor(rand() * ops.length)];
        let a, b, result;
        if (op === '+') {
          a = Math.floor(rand() * (settings.max - settings.min + 1)) + settings.min;
          let maxB = settings.max - a;
          if (maxB < settings.min) maxB = settings.min;
          b = Math.floor(rand() * (maxB - settings.min + 1)) + settings.min;
          result = a + b;
        } else {
          a = Math.floor(rand() * (settings.max - settings.min + 1)) + settings.min;
          let maxRes = a - settings.min;
          if (maxRes < 0) maxRes = 0;
          result = Math.floor(rand() * (maxRes + 1)) + settings.min;
          b = a - result;
        }
        const hidePos = Math.floor(rand() * 3);
        const hideThis = rand() < settings.hideRate;
        const values = [a, b, result];
        row.appendChild(createBox(values[0], hideThis && hidePos === 0, answerArray, answerArray.length));
        const opSpan = document.createElement('span'); opSpan.className = 'operator'; opSpan.textContent = op; row.appendChild(opSpan);
        row.appendChild(createBox(values[1], hideThis && hidePos === 1, answerArray, answerArray.length));
        const eqSpan = document.createElement('span'); eqSpan.className = 'equals'; eqSpan.textContent = '='; row.appendChild(eqSpan);
        row.appendChild(createBox(values[2], hideThis && hidePos === 2, answerArray, answerArray.length));
        container.appendChild(row);
      }
      return container;
    }
  };

  exercises.bonds = {
    title: '🎯 Number Bonds',
    instructions: 'Find the missing addend to reach the target.',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const target = settings.max <= 15 ? 10 : 20;
      const problemCount = 10 * settings.multiplier;
      for (let i = 0; i < problemCount; i++) {
        const row = document.createElement('div'); row.className = 'bond-container';
        const a = Math.floor(rand() * (target + 1));
        const b = target - a;
        const hideFirst = rand() < 0.5;
        if (hideFirst) {
          row.appendChild(createBox(a, true, answerArray, answerArray.length));
          const plus = document.createElement('span'); plus.className = 'operator'; plus.textContent = '+'; row.appendChild(plus);
          row.appendChild(createBox(b, false));
        } else {
          row.appendChild(createBox(a, false));
          const plus = document.createElement('span'); plus.className = 'operator'; plus.textContent = '+'; row.appendChild(plus);
          row.appendChild(createBox(b, true, answerArray, answerArray.length));
        }
        const eq = document.createElement('span'); eq.className = 'equals'; eq.textContent = '='; row.appendChild(eq);
        const targetDiv = document.createElement('div'); targetDiv.className = 'bond-target'; targetDiv.textContent = target;
        row.appendChild(targetDiv);
        container.appendChild(row);
      }
      return container;
    }
  };

  exercises.compare = {
    title: '⚖️ Compare Numbers',
    instructions: 'Write <, >, or = in the blank.',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const problemCount = 15 * settings.multiplier;
      for (let i = 0; i < problemCount; i++) {
        const row = document.createElement('div'); row.className = 'compare-row';
        const a = Math.floor(rand() * (settings.max - settings.min + 1)) + settings.min;
        const b = Math.floor(rand() * (settings.max - settings.min + 1)) + settings.min;
        const correct = a === b ? '=' : (a > b ? '>' : '<');
        row.appendChild(createBox(a, false));
        row.appendChild(createBox(correct, true, answerArray, answerArray.length, { type: 'compare' }));
        row.appendChild(createBox(b, false));
        container.appendChild(row);
      }
      return container;
    }
  };

  exercises.pattern = {
    title: '🧩 Patterns',
    instructions: 'What comes next?',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const patterns = [['A','B','A','B','?'], ['A','A','B','B','?'], ['A','B','C','A','B','?']];
      const problemCount = 8 * settings.multiplier;
      for (let p = 0; p < problemCount; p++) {
        const row = document.createElement('div'); row.className = 'pattern-row';
        const pat = patterns[Math.floor(rand() * patterns.length)].slice();
        const qIdx = pat.indexOf('?');
        if (qIdx > 0) {
          const prev = pat[qIdx-1];
          let next = '';
          const map = {'A':'B', 'B':(prev==='A'?'B':(pat.includes('C')?'C':'A')), 'C':'A'};
          next = map[prev] || 'A';
          pat[qIdx] = next;
        }
        for (let i = 0; i < pat.length; i++) {
          if (pat[i] === '?') {
            const correct = pat[qIdx];
            row.appendChild(createBox(correct, true, answerArray, answerArray.length));
          } else {
            const display = {A:'🔵',B:'🟡',C:'🔴'}[pat[i]] || pat[i];
            const box = document.createElement('div'); box.className = `pattern-item pattern-${pat[i].toLowerCase()}`; box.textContent = display;
            row.appendChild(box);
          }
        }
        container.appendChild(row);
      }
      return container;
    }
  };

  exercises.words = {
    title: '🔤 Number Words',
    instructions: 'Write the number or word.',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
      const problemCount = 15 * settings.multiplier;
      for (let i = 0; i < problemCount; i++) {
        const row = document.createElement('div'); row.className = 'arith-row';
        const num = Math.floor(rand() * Math.min(21, settings.max - settings.min + 1)) + settings.min;
        const word = words[num] || num.toString();
        const hideWord = rand() < 0.5;
        if (hideWord) {
          row.appendChild(createBox(num, false));
          const eq = document.createElement('span'); eq.className = 'equals'; eq.textContent = '→'; row.appendChild(eq);
          row.appendChild(createBox(word, true, answerArray, answerArray.length, { type: 'words' }));
        } else {
          row.appendChild(createBox(word, true, answerArray, answerArray.length, { type: 'words' }));
          const eq = document.createElement('span'); eq.className = 'equals'; eq.textContent = '→'; row.appendChild(eq);
          row.appendChild(createBox(num, false));
        }
        container.appendChild(row);
      }
      return container;
    }
  };

  exercises.mixed = {
    title: '🔀 Mixed Practice',
    instructions: 'A mix of skills!',
    generate: (rand, settings, answerArray) => {
      const container = document.createElement('div');
      const parts = [];
      for (let i = 0; i < settings.multiplier; i++) {
        parts.push(exercises.arithmetic.generate(rand, { ...settings, multiplier:1 }, answerArray));
        parts.push(exercises.sequence.generate(rand, { ...settings, multiplier:1 }, answerArray));
        parts.push(exercises.pattern.generate(rand, { ...settings, multiplier:1 }, answerArray));
      }
      parts.forEach(part => container.appendChild(part));
      return container;
    }
  };

  const topicNames = {
    sequence: 'Sequences', skip: 'Skip Counting', arithmetic: 'Arithmetic',
    bonds: 'Number Bonds', compare: 'Compare Numbers', pattern: 'Patterns',
    words: 'Number Words', mixed: 'Mixed Practice'
  };
  for (let id in topicNames) {
    if (exercises[id]) {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = topicNames[id];
      topicSelect.appendChild(option);
    }
  }
  currentTopicId = 'arithmetic';
  topicSelect.value = currentTopicId;

  function updateSkipInput() {
    customSkipInput.style.display = skipSelect.value === 'custom' ? 'inline-block' : 'none';
  }
  skipSelect.addEventListener('change', updateSkipInput);
  customSkipInput.addEventListener('input', updateSkipInput);
  updateSkipInput();

  function generateWorksheetHTML(seed, settings, topicId, isDense = false) {
    const rand = seededRandom(seed);
    const ex = exercises[topicId];
    if (!ex) return '';
    
    let instructions = ex.instructions;
    if (topicId === 'skip') instructions = `Count by ${settings.skipVal}.`;
    
    const answers = [];
    const content = ex.generate(rand, settings, answers);
    
    const temp = document.createElement('div');
    temp.className = `worksheet-card ${isDense ? 'print-dense' : ''}`;
    temp.innerHTML = `<div class="card-header"><div class="card-title">${ex.title}</div><div class="seed-hint">🔑 ${seed.toString().slice(0,8)}</div></div><div class="instructions">${instructions}</div>`;
    temp.appendChild(content);
    
    return temp.outerHTML;
  }

  function generate(isDense = false) {
    const seedRaw = seedInput.value.trim();
    currentSeed = seedRaw ? stringToSeed(seedRaw) : Date.now();
    if (!seedRaw) seedInput.placeholder = currentSeed.toString().slice(0,8);
    rng = seededRandom(currentSeed);
    const settings = getSettings();
    const topicId = topicSelect.value;
    const ex = exercises[topicId];
    if (!ex) return;
    currentAnswers = [];
    worksheetCompleted = false;
    worksheetArea.innerHTML = '';
    answerContentDiv.innerHTML = '';

    const card = document.createElement('div'); 
    card.className = `worksheet-card ${isDense ? 'print-dense' : ''}`;
    let instructions = ex.instructions;
    if (topicId === 'skip') instructions = `Count by ${settings.skipVal}.`;
    card.innerHTML = `<div class="card-header"><div class="card-title">${ex.title}</div><div class="seed-hint">🔑 ${currentSeed.toString().slice(0,8)}</div></div><div class="instructions">${instructions}</div>`;
    const content = ex.generate(rng, settings, currentAnswers);
    card.appendChild(content);
    worksheetArea.appendChild(card);

    currentAnswers.forEach((ans, idx) => {
      if (ans !== undefined && ans !== null) {
        const item = document.createElement('div'); item.className = 'answer-item';
        item.innerHTML = `<span>#${idx+1}</span><strong>${ans}</strong>`;
        answerContentDiv.appendChild(item);
      }
    });
    const modeMsg = isDense ? ' (A4 2-column dense)' : '';
    showToast(`✨ New worksheet ready${modeMsg}!`);
  }

  function preparePrintContent() {
    const originalMultiplier = printMultiplier;
    printMultiplier = 6;
    generate(true);
    return originalMultiplier;
  }

  function restoreAfterPrint(originalMultiplier) {
    printMultiplier = originalMultiplier;
    generate(false);
  }

  function printWorksheet() {
    const originalMultiplier = preparePrintContent();
    const handleAfterPrint = () => {
      restoreAfterPrint(originalMultiplier);
      window.removeEventListener('afterprint', handleAfterPrint);
    };
    window.addEventListener('afterprint', handleAfterPrint);
    setTimeout(() => window.print(), 100);
  }

  function showPrintPreview() {
    const originalMultiplier = printMultiplier;
    printMultiplier = 6;
    
    const seedRaw = seedInput.value.trim();
    const seed = seedRaw ? stringToSeed(seedRaw) : Date.now();
    const settings = getSettings();
    const topicId = topicSelect.value;
    
    previewContent.innerHTML = generateWorksheetHTML(seed, settings, topicId, true);
    previewModal.classList.add('active');
    
    printMultiplier = originalMultiplier;
    generate(false);
    showToast('👁️ A4 Preview (2 columns)');
  }

  function closePreview() {
    previewModal.classList.remove('active');
    previewContent.innerHTML = '';
  }

  function printFromPreview() {
    const seedRaw = seedInput.value.trim();
    const seed = seedRaw ? stringToSeed(seedRaw) : Date.now();
    const settings = getSettings();
    const topicId = topicSelect.value;
    
    const printWindow = window.open('', '_blank', 'width=800,height=900');
    printWindow.document.write(`
      <!DOCTYPE html>
      <html><head><meta charset="UTF-8"><title>Print Worksheet</title>
      <style>${document.querySelector('style').innerHTML}</style></head>
      <body onload="setTimeout(()=>window.print(),100);setTimeout(()=>window.close(),5000);">
      ${generateWorksheetHTML(seed, { ...settings, multiplier: 6 }, topicId, true)}
      </body></html>
    `);
    printWindow.document.close();
    closePreview();
  }

  window.addEventListener('beforeprint', () => showToast('🖨️ Preparing A4 2-column layout...'));

  function checkComplete() {
    if (worksheetCompleted) return;
    const inputs = document.querySelectorAll('#worksheetArea input, #worksheetArea select');
    if (!inputs.length) return;
    let allCorrect = true;
    inputs.forEach(el => {
      const ans = el.dataset?.answer;
      if (!ans) return;
      let val = (el.value?.trim().toLowerCase().replace(/\s+/g, '') || '');
      let cleanAns = ans.toLowerCase().replace(/\s+/g, '');
      if (val !== cleanAns && val !== ans) allCorrect = false;
    });
    if (allCorrect) {
      worksheetCompleted = true;
      const topicId = topicSelect.value;
      const stampMap = { sequence:0, arithmetic:1, pattern:2, mixed:3 };
      const idx = stampMap[topicId] !== undefined ? stampMap[topicId] : 4;
      awardStamp(idx);
    }
  }

  function loadStamps() { return JSON.parse(localStorage.getItem('pp_stamps') || '[]'); }
  function saveStamps(stamps) { localStorage.setItem('pp_stamps', JSON.stringify(stamps)); }
  function updateStampsUI() {
    const stamps = loadStamps();
    progressSpan.textContent = `${stamps.length}/5`;
    const stampDivs = stampsContainer.querySelectorAll('.stamp');
    stampDivs.forEach((div, i) => {
      if (stamps.includes(i)) div.classList.add('earned');
      else div.classList.remove('earned');
    });
  }
  function awardStamp(idx) {
    const stamps = loadStamps();
    if (!stamps.includes(idx)) {
      stamps.push(idx);
      saveStamps(stamps);
      updateStampsUI();
      showCelebration();
      showToast('🏆 Stamp earned!');
    }
  }
  function resetStamps() { saveStamps([]); updateStampsUI(); showToast('Stamps reset'); }
  function showCelebration() {
    const c = document.getElementById('celebration');
    c.style.display = 'block'; c.innerHTML = '';
    const colors = ['#6c5ce7','#00cec9','#fdcb6e','#e84393'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div'); p.className = 'confetti';
      p.style.left = `${Math.random()*100}%`;
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = `${Math.random()*1.5}s`;
      p.style.width = p.style.height = `${Math.random()*6+6}px`;
      c.appendChild(p);
    }
    setTimeout(() => c.style.display = 'none', 2500);
  }

  function toggleAnswers() { answerKeyDiv.classList.toggle('visible'); showToast(answerKeyDiv.classList.contains('visible') ? 'Answers shown' : 'Answers hidden'); }
  function toggleCompact() { document.body.classList.toggle('compact'); compactBtn.classList.toggle('active'); localStorage.setItem('pp_compact', document.body.classList.contains('compact')); }
  function toggleSettingsPanel() { controlsPanel.classList.toggle('collapsed'); }

  function applyTheme(theme) { document.body.className = `theme-${theme}`; localStorage.setItem('pp_theme', theme); }
  function loadUserSettings() {
    const savedTheme = localStorage.getItem('pp_theme') || 'space';
    themeSelect.value = savedTheme; applyTheme(savedTheme);
    if (localStorage.getItem('pp_compact') === 'true') { document.body.classList.add('compact'); compactBtn.classList.add('active'); }
    const savedTopic = localStorage.getItem('pp_topic'); if (savedTopic && exercises[savedTopic]) topicSelect.value = savedTopic;
    const savedMin = localStorage.getItem('pp_min'); if (savedMin) minInput.value = savedMin;
    const savedMax = localStorage.getItem('pp_max'); if (savedMax) maxInput.value = savedMax;
    const savedDiff = localStorage.getItem('pp_difficulty'); if (savedDiff) diffSelect.value = savedDiff;
    const savedSkip = localStorage.getItem('pp_skip'); if (savedSkip) skipSelect.value = savedSkip;
    const savedCustomSkip = localStorage.getItem('pp_customSkip'); if (savedCustomSkip) customSkipInput.value = savedCustomSkip;
    updateSkipInput();
  }
  function saveUISettings() {
    localStorage.setItem('pp_topic', topicSelect.value);
    localStorage.setItem('pp_min', minInput.value);
    localStorage.setItem('pp_max', maxInput.value);
    localStorage.setItem('pp_difficulty', diffSelect.value);
    localStorage.setItem('pp_skip', skipSelect.value);
    localStorage.setItem('pp_customSkip', customSkipInput.value);
  }

  generateBtn.onclick = () => { printMultiplier = 1; generate(false); saveUISettings(); };
  answersBtn.onclick = toggleAnswers;
  compactBtn.onclick = toggleCompact;
  previewBtn.onclick = () => showPrintPreview();
  previewCloseBtn.onclick = () => closePreview();
  previewPrintBtn.onclick = () => printFromPreview();
  previewModal.onclick = (e) => { if (e.target === previewModal) closePreview(); };
  printBtn.onclick = () => printWorksheet();
  resetStampsBtn.onclick = resetStamps;
  settingsToggle.onclick = toggleSettingsPanel;
  themeSelect.onchange = (e) => applyTheme(e.target.value);
  topicSelect.onchange = () => { saveUISettings(); generate(false); };
  minInput.onchange = () => { saveUISettings(); generate(false); };
  maxInput.onchange = () => { saveUISettings(); generate(false); };
  diffSelect.onchange = () => { saveUISettings(); generate(false); };
  skipSelect.onchange = () => { saveUISettings(); updateSkipInput(); generate(false); };
  customSkipInput.onchange = () => { saveUISettings(); generate(false); };

  for (let i = 0; i < 5; i++) {
    const stamp = document.createElement('div'); stamp.className = 'stamp'; stamp.textContent = i===4 ? '⭐' : (i+1);
    stampsContainer.appendChild(stamp);
  }

  loadUserSettings();
  updateStampsUI();
  printMultiplier = 1;
  generate(false);
  document.addEventListener('keydown', (e) => { 
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { 
      e.preventDefault(); printMultiplier = 1; generate(false); saveUISettings(); 
    } 
    if (e.key === 'Escape' && previewModal.classList.contains('active')) closePreview();
  });
})();
</script>
</body>
</html>
